<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b1220'><link rel='manifest' href='manifest.webmanifest?v=2.4.2'><link rel='stylesheet' href='styles.css?v=2.4.2'><title>Farhad Trainer V2.4.2</title></head><body>
<header class='topbar'><div><b>Farhad Trainer</b><div class='sub'>V2.4.2 · Button Fix</div></div></header>
<main>
<section id='home' class='page active'><div class='hero'><h1>Workout A → B → C</h1><p>Train in sequence whenever your week allows.</p></div><div class='metrics'><div class='metric'><span>Weight</span><strong id='homeWeight'>Loading…</strong><small>lb</small></div><div class='metric'><span>This week</span><strong id='homeSessions'>Loading…</strong></div><div class='metric'><span>PRs</span><strong id='homePRs'>Loading…</strong></div><div class='metric'><span>Adherence</span><strong id='homeAdherence'>Loading…</strong></div></div><div class='panel'><h2 id='nextWorkoutTitle'>Loading…</h2><div id='nextWorkoutMeta' class='muted'></div><button id='startNextBtn'>Start next workout</button></div><div class='panel'><h2>Body check-in</h2><div id='bodyCheckSummary' class='muted'>Loading…</div><button id='goProgressBtn' class='secondary'>Open progress</button></div></section>
<section id='workout' class='page'><div class='panel tabs'><button id='currentSessionTab' class='active'>Current session</button><button id='historyTab'>Workout history</button></div><div id='sessionView'><div class='panel'><select id='workoutSelect'><option value='1'>Workout A — Push + Core</option><option value='2'>Workout B — Pull + Core</option><option value='3'>Workout C — Legs + Shoulders</option></select><input id='workoutDate' type='date'></div><div id='exerciseCards'></div><div class='panel'><textarea id='sessionNotes' placeholder='Notes'></textarea><button id='saveDraftBtn' class='secondary'>Save draft</button><button id='finishBtn'>Finish workout</button></div></div><div id='historyView' class='hidden'><div class='panel'><div class='row'><h2>Completed workouts</h2><button id='backToSessionBtn' class='secondary'>Back</button></div><div id='historyList'></div></div></div></section>
<section id='progress' class='page'><div class='panel'><h2>Measurement check-in</h2><div class='grid5'><label>Weight lb <button class='help' data-help='weight'>?</button><input id='mWeight' type='number' step='.1'></label><label>Waist cm <button class='help' data-help='waist'>?</button><input id='mWaist' type='number' step='.1'></label><label>Chest cm <button class='help' data-help='chest'>?</button><input id='mChest' type='number' step='.1'></label><label>Arm cm <button class='help' data-help='arm'>?</button><input id='mArm' type='number' step='.1'></label><label>Thigh cm <button class='help' data-help='thigh'>?</button><input id='mThigh' type='number' step='.1'></label></div><textarea id='mNote' placeholder='Note'></textarea><div class='photos'><label>Front<input id='pFront' type='file' accept='image/*'></label><label>Side<input id='pSide' type='file' accept='image/*'></label><label>Back<input id='pBack' type='file' accept='image/*'></label></div><button id='saveMeasurementBtn'>Save progress entry</button></div><div class='panel'><h2>Previous entries</h2><div id='measurementHistory'></div></div></section>
<section id='settings' class='page'><div class='panel'><h2>Farhad Trainer V2.4.2</h2><button id='refreshBtn' class='secondary'>Refresh app files</button><button id='exportBtn' class='secondary'>Export backup</button></div></section>
</main>
<nav><button data-page='home' class='active'>Home</button><button data-page='workout'>Workout</button><button data-page='progress'>Progress</button><button data-page='settings'>Settings</button></nav>
<div id='modal' class='modal hidden'><div class='modalcard'><button id='closeModal' class='close'>×</button><div id='modalContent'></div></div></div><div id='toast' class='toast hidden'></div><script src='app.js?v=2.4.2'></script></body></html>
